name: Unity Compile Check

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменяем предыдущий прогон на той же ветке — не копим очередь
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.60f1
  UNITY_REVISION: 61dfb374e36f

jobs:
  # ============================================================
  # Быстрый гейт компиляции. Unity-лицензия НЕ нужна:
  # обычный Roslyn (dotnet build) компилирует рантайм-скрипты
  # против managed-сборок Unity, вынутых из официального
  # Linux-редактора (download.unity3d.com). Пакет UnityEngine.Modules
  # из NuGet для этого не годится — там максимум 2021.3.33 и нет
  # API Unity 6 (Rigidbody2D.linearDamping и т.п.).
  #
  # Первый прогон качает редактор (~4.5 ГБ), дальше refs лежат
  # в actions/cache (~50 МБ) и гейт укладывается в ~1 минуту.
  # ============================================================
  compile-check:
    name: Roslyn compile (no license needed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Unity reference assemblies
        id: unity-refs
        uses: actions/cache@v4
        with:
          path: /tmp/unityrefs
          key: unity-refs-${{ env.UNITY_VERSION }}-${{ env.UNITY_REVISION }}

      - name: Download Unity editor and extract reference assemblies
        if: steps.unity-refs.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p /tmp/unityrefs
          curl -fSL --retry 3 -o /tmp/Unity.tar.xz \
            "https://download.unity3d.com/download_unity/${UNITY_REVISION}/LinuxEditorInstaller/Unity.tar.xz"
          # Берём только managed-модули движка, остальные 4 ГБ не распаковываем.
          # Пути в архиве начинаются с Editor/ (без ведущего каталога).
          # Монолитный Editor/Data/Managed/UnityEngine.dll намеренно НЕ берём:
          # он дублирует типы модулей → CS0433.
          # xz -T0 — распаковка в несколько потоков, иначе шаг упирается в один ядерный поток.
          xz -T0 -dc /tmp/Unity.tar.xz | tar -x -C /tmp/unityrefs \
            --wildcards 'Editor/Data/Managed/UnityEngine/*.dll'
          find /tmp/unityrefs -mindepth 2 -name '*.dll' -exec mv -t /tmp/unityrefs {} +
          rm -rf /tmp/unityrefs/Editor
          rm -f /tmp/Unity.tar.xz
          ls -1 /tmp/unityrefs/*.dll | wc -l

      - name: Scaffold project and wire up Unity refs
        run: |
          set -eux
          dotnet new classlib -o /tmp/check --force
          rm -f /tmp/check/Class1.cs
          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            echo '  <PropertyGroup>'
            echo '    <TargetFramework>net8.0</TargetFramework>'
            echo '    <ImplicitUsings>disable</ImplicitUsings>'
            echo '    <Nullable>disable</Nullable>'
            echo '    <NoWarn>CS0649;CS0414;CS0169;CS0108</NoWarn>'
            echo '  </PropertyGroup>'
            echo '  <ItemGroup>'
            for dll in /tmp/unityrefs/*.dll; do
              name="$(basename "$dll" .dll)"
              echo "    <Reference Include=\"$name\"><HintPath>$dll</HintPath><Private>false</Private></Reference>"
            done
            echo '  </ItemGroup>'
            echo '</Project>'
          } > /tmp/check/check.csproj

      - name: Copy runtime scripts (Assets/Scripts/**, editor scripts excluded)
        run: |
          set -eux
          find Assets/Scripts -name '*.cs' -type f -not -path 'Assets/Editor/*' -print0 \
            | xargs -0 -I{} cp {} /tmp/check/
          echo "scripts copied: $(ls -1 /tmp/check/*.cs | wc -l)"

      - name: Build
        run: dotnet build /tmp/check -c Release --nologo

  # ============================================================
  # Полная Unity-сборка. Нужен UNITY_LICENSE (секрет), пока его нет —
  # job падает, но НЕ валит гейт: continue-on-error + без needs.
  # ============================================================
  unity-build:
    name: Unity build (needs UNITY_LICENSE)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity - build (batchmode)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          projectPath: .
          buildName: BeeSwarm
          buildsPath: Builds

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeeSwarm-linux
          path: Builds/**
          if-no-files-found: error
